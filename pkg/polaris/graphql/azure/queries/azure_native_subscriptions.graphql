query RubrikPolarisSDKRequest($after: String, $filter: String!) {
  result: azureNativeSubscriptions(
    azureNativeProtectionFeatures: [
      VM,
      SQL_MI,
      SQL_DB,
      BLOB,
      POSTGRES_FLEXIBLE_SERVER,
      AZ_CLOUD_DISCOVERY,
    ]
    after: $after
    subscriptionFilters: { nameSubstringFilter: { nameSubstring: $filter } }
  ) {
    count
    edges {
      node {
        id
        accountConnectionId
        azureSubscriptionNativeId
        name
        azureSubscriptionStatus
        slaAssignment
        configuredSlaDomain {
          id
          name
        }
        effectiveSlaDomain {
          id
          name
        }
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}
