query RubrikPolarisSDKRequest($cloudType: AzureCloudType!, $tenantDomainName: String!, $sessionId: UUID!) {
    result: azureListManagementGroups(input: {
        cloudType:        $cloudType,
        tenantDomainName: $tenantDomainName,
        sessionId:        $sessionId
    }) {
        managementGroups {
            nativeId
            name
            isAuthorized
        }
    }
}
