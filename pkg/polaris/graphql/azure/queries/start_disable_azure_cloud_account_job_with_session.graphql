mutation RubrikPolarisSDKRequest($cloudAccountIds: [UUID!]!, $feature: CloudAccountFeature!, $sessionId: UUID!, $deleteSnapshots: Boolean) {
  result: startDisableAzureCloudAccountJob(input: {
    feature:         $feature,
    cloudAccountIds: $cloudAccountIds,
    sessionId:       $sessionId,
    deleteSnapshots: $deleteSnapshots
  }) {
    jobIds {
      jobId
    }
    errors {
      error
    }
  }
}
