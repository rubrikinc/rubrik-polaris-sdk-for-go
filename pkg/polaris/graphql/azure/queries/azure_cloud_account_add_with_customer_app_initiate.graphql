mutation RubrikPolarisSDKRequest($cloudType: AzureCloudType!, $tenantDomainName: String!, $appId: String, $appSecretKey: String, $redirectUrl: String!) {
    result: azureCloudAccountAddWithCustomerAppInitiate(input: {
        cloudType:        $cloudType,
        tenantDomainName: $tenantDomainName,
        appId:            $appId,
        appSecretKey:     $appSecretKey,
        redirectUrl:      $redirectUrl
    }) {
        sessionId
        success
    }
}
