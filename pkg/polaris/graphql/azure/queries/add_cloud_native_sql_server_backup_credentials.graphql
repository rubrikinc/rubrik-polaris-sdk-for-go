mutation RubrikPolarisSDKRequest($objectIds: [UUID!]!, $workloadType: WorkloadLevelHierarchy!, $backupCredentials: LoginCredentials, $shouldUseAad: Boolean) {
    result: addCloudNativeSqlServerBackupCredentials(input: {
        objectIds:         $objectIds,
        workloadType:      $workloadType,
        backupCredentials: $backupCredentials,
        shouldUseAad:      $shouldUseAad
    }) {
        successObjectIds
        failedObjectIds
    }
}
