query RubrikPolarisSDKRequest($first: Int, $after: String, $applicationName: String) {
    result: cloudNativeApplications(first: $first, after: $after, filter: {
        applicationName: $applicationName,
        cloudTypes:      [AWS],
    }) {
        nodes {
            id
            name
        }
        pageInfo {
            endCursor
            hasNextPage
        }
    }
}
