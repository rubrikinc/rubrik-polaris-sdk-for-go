query RubrikPolarisSDKRequest($first: Int, $after: String, $applicationName: String, $cloudNativeAccountIds: [String!]) {
    result: cloudNativeApplications(first: $first, after: $after, filter: {
        applicationName:       $applicationName,
        cloudNativeAccountIds: $cloudNativeAccountIds,
        cloudTypes:            [AWS],
    }) {
        nodes {
            id
            name
        }
        pageInfo {
            endCursor
            hasNextPage
        }
    }
}
