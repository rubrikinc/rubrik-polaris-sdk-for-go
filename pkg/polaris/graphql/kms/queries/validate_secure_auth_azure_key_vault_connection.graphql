query RubrikPolarisSDKRequest($tenantId: String!, $vaultUrl: URL!) {
    result: validateKmsConnection(input: {
        kmsDetails: {
            secureAuthAzureKeyVault: {
                tenantId: $tenantId,
                vaultUrl: $vaultUrl,
            },
        },
    }) {
        errorString
    }
}
