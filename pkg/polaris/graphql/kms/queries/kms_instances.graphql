query RubrikPolarisSDKRequest(
    $first:                    Int,
    $after:                    String,
    $kmsName:                  String,
    $kmsTypeFilter:            [KmsType!],
    $provisioningMethodFilter: [ProvisioningMethod!],
) {
    result: kmsInstances(
        first:                    $first,
        after:                    $after,
        kmsName:                  $kmsName,
        kmsTypeFilter:            $kmsTypeFilter,
        provisioningMethodFilter: $provisioningMethodFilter,
    ) {
        nodes {
            name
            description
            kmsType
            naturalId
            dataLocationsCount
            keyVaultInfo {
                ... on AwsKmsInfo {
                    id: kmsId
                    provisioningMethod
                    cloudAccountId
                    iamRoleArn
                    awsRegion: regionEnum
                    stsRegionEndpoint
                    kmsRegionEndpoint
                }
                ... on AzureKeyVaultInfo {
                    id: kmsKeyVaultId
                    provisioningMethod
                    cloudAccountId
                    keyVaultUrl
                    tenantId
                    clientId
                    azureRegion: region
                }
                ... on GcpKmsInfo {
                    id: kmsId
                    provisioningMethod
                    cloudAccountId
                    keyRing
                    gcpLocation: location
                }
                ... on KmipServerInfo {
                    address
                    port
                }
            }
        }
        pageInfo {
            endCursor
            hasNextPage
        }
    }
}
