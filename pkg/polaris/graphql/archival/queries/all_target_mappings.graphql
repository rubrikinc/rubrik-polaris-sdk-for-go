query RubrikPolarisSDKRequest($filter: [TargetMappingFilterInput!]) {
    result: allTargetMappings(sortBy: NAME, sortOrder: ASC, filter: $filter) {
        id
        name
        groupType
        targetType
        connectionStatus {
            status
        }
        targetTemplate {
            ... on AwsTargetTemplate {
                cloudAccount {
                    cloudAccountId
                }
                bucketPrefix
                awsStorageClass: storageClass
                awsRegion: region
                kmsMasterKeyId
                cloudNativeLocTemplateType
                bucketTags {
                    key
                    value
                }
            }
            ... on AzureTargetTemplate {
                cloudAccount {
                    cloudAccountId
                }
                cloudNativeCompanion {
                    cloudNativeLocTemplateType
                    cmkInfo {
                        keyName
                        keyVaultName
                        region
                    }
                    networkAccessType
                    redundancy
                    storageAccountRegion
                    storageAccountTags {
                        key
                        value
                    }
                    storageTier
                    subscriptionNativeId
                }
                containerNamePrefix
                storageAccountName
            }
            ... on GcpTargetTemplate {
                cloudAccount {
                    cloudAccountId
                }
                bucketPrefix
                gcpStorageClass: storageClass
                gcpRegion: region
                cmkInfo {
                    keyName
                    keyRingName
                    region
                }
                cloudNativeLocTemplateType
                labels {
                    key
                    value
                }
            }
            ... on RcvAwsTargetTemplate {
                rcvAwsRegion: region
                rcvAwsTier: tier
                rcvAwsRedundancy: redundancy
                rcvAwsEncryptionType: encryptionType
                cloudNativeLocTemplateType
                templateLocationId
                sourceWorkloadCloud
            }
            ... on RcsAzureTargetTemplate {
                rcvAzureRegion: region
                rcvAzureTier: tier
                rcvAzureRedundancy: redundancy
                rcvAzureEncryptionType: encryptionType
                immutabilitySettings {
                    lockDurationDays
                }
                cloudNativeLocTemplateType
                templateLocationId
                sourceWorkloadCloud
            }
            ... on RcvGcpTargetTemplate {
                rcvGcpRegion: region
                rcvGcpTier: tier
                rcvGcpEncryptionType: encryptionType
                cloudNativeLocTemplateType
                templateLocationId
                sourceWorkloadCloud
            }
        }
    }
}
